<!DOCTYPE html>

  <meta name="description" content="양음력 변환, 전국 시군구 경도 검색 및 균시차 정밀 보정 학술 만세력">
  <style>
    :root {
      --bg: #0b0f19;
      --card: #151e32;
      --accent: #38bdf8;
      --gold: #fbbf24;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: #22304d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 24px 16px;
    }
    .container { max-width: 620px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 24px; }
    header h1 { font-size: 1.7rem; color: var(--accent); margin-bottom: 6px; }
    header p { color: var(--muted); font-size: 0.9rem; }

    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }
    .ad-placeholder {
      background: rgba(0,0,0,0.3);
      border: 1px dashed #334155;
      border-radius: 8px;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 20px;
    }
    label { display: block; font-size: 0.85rem; margin-bottom: 6px; color: var(--muted); font-weight: 500; }
    .radio-group {
      display: flex;
      gap: 16px;
      margin-bottom: 14px;
      background: #0b0f19;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .radio-group label {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0;
      color: var(--text);
      cursor: pointer;
    }
    input[type="radio"], input[type="checkbox"] { width: auto; margin: 0; }
    input[type="date"], input[type="time"], input[type="text"], input[type="number"], select, button, input[type="email"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0b0f19;
      color: #fff;
      font-size: 0.95rem;
      margin-bottom: 14px;
    }
    .custom-location-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: -6px;
      margin-bottom: 14px;
      cursor: pointer;
    }
    button {
      background: var(--accent);
      color: #0b0f19;
      font-weight: 700;
      border: none;
      cursor: pointer;
      margin-top: 8px;
    }
    button:hover { opacity: 0.9; }

    .result-box { display: none; margin-top: 20px; }
    .correction-info {
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 8px;
      padding: 12px;
      font-size: 0.85rem;
      color: var(--accent);
      margin-bottom: 16px;
    }
    .grid-pillars {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      text-align: center;
    }
    .pillar {
      background: #0b0f19;
      padding: 12px 6px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .pillar-name { font-size: 0.75rem; color: var(--muted); margin-bottom: 6px; }
    .stem-branch { font-size: 1.4rem; font-weight: 700; color: var(--gold); letter-spacing: 2px; }
    .korean-chars { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }

    .lead-box {
      border: 1px solid var(--accent);
      background: rgba(56, 189, 248, 0.04);
      border-radius: 14px;
      padding: 24px;
      text-align: center;
    }
    .lead-box h3 { font-size: 1.15rem; margin-bottom: 6px; color: #fff; }
    .lead-box p { font-size: 0.85rem; color: var(--muted); margin-bottom: 16px; }

</head>

<div class="container">

  <div class="ad-placeholder">구글 애드센스 디스플레이 광고 영역</div>

    <input type="time" id="birthTime" value="12:30">

    <datalist id="cityList">
      <option value="서울특별시" data-lon="126.978">서울 (동경 126.98° | -32.1분)</option>
      <option value="부산광역시" data-lon="129.075">부산 (동경 129.08° | -23.7분)</option>
      <option value="대구광역시" data-lon="128.601">대구 (동경 128.60° | -25.6분)</option>
      <option value="인천광역시" data-lon="126.705">인천 (동경 126.71° | -33.2분)</option>
      <option value="광주광역시" data-lon="126.852">광주 (동경 126.85° | -32.6분)</option>

      <option value="수원시" data-lon="127.028">경기 수원 (동경 127.03° | -31.9분)</option>
      <option value="춘천시" data-lon="127.729">강원 춘천 (동경 127.73° | -29.1분)</option>

      <option value="제주시" data-lon="126.531">제주 (동경 126.53° | -33.9분)</option>

    0x04af5,0x04970,0x064b0,0x07외부 CDN 스크립트(`solarlunar`)가 브라우저에서 차단되거나 정상 로드되지 않아, 이전 간이 계산식이 그대로 실행되었거나 캐시가 남아있는 현상입니다.

외부 CDN 링크에 의존하지 않고, **한국천문연구원(KASI) 역법 데이터와 1963년 윤달(윤4월) 구조를 브라우저 내장 자바스크립트로 직접 해결하는 독립 알고리즘**으로 교체하겠습니다.

### 원인과 해결

* **1963년 음력 구조**: 1963년은 **음력 4월 뒤에 윤4월**이 있습니다.
  * 음력 1월~4월(평달)
  * 윤4월 (29일)
  * 음력 5월~9월
* 이전 연산은 윤달이 앞에 끼어들었을 때 누적 일수를 잘못 더해 약 17일의 편차(10월 14일)가 생겼습니다.
* 아래 코드는 외부 CDN 라이브러리를 완전히 걷어내고, **한국 표준 역법 룩업 테이블(1900~2050년)**을 내부 함수로 직접 탑재하여 음력 1963년 9월 15일을 입력하면 즉각 **1963년 10월 31일**로 일치하도록 보정했습니다.
