name: Daily Development Automation

on:
  push:
    paths:
      - 'docs/daily/**'

jobs:
  run-daily-task:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest anthropic

      - name: Run Claude Developer Script & Test
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "Starting Daily Task Execution..."
          # 여기에 Claude API를 호출하여 코드 생성 및 pytest를 실행하는 스크립트/명령어를 위치시킵니다.
          # 예시: python scripts/run_claude_dev.py