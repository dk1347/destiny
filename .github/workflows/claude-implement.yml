name: Claude Implementation

on:
  push:
    paths:
      - 'docs/daily/**/instructions.md'

jobs:
  implement:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pip3 install anthropic --break-system-packages
          pip3 install -e ".[dev,api]" --break-system-packages

      - name: Run Claude implementation
        env:
          GITHUB_TOKEN_PAT : ${{ secrets.GITHUB_TOKEN_PAT  }}
        run: |
          python3 docs/scripts/claude_implement.py

      - name: Run pytest
        run: |
          python3 -m pytest tests/ -v --tb=short 2>&1 | tee pytest_result.txt

      - name: Commit results
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -A
          git diff --staged --quiet || git commit -m "chore: auto-implementation $(date +%Y-%m-%d)"
          git pull --rebase origin fix/v3-data-integrity
          git push origin fix/v3-data-integrity
